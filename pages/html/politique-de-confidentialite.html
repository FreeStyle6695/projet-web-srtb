        <meta name="author" content="Maxence DELCOURTE">    <!--l'auteur de la page-->
        <meta name="keywords" content="">   <!--ce que contient la page-->

        <meta name="robots" content="index, follow">    <!--référencer la page + suivre les liens-->

        <!--Les lignes pour le favicon-->
        <link rel="icon" type="image/png" href="/images/favicon/favicon-96x96.png" sizes="96x96" />

        <link rel="shortcut icon" href="/images/favicon/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png" />
        <link rel="manifest" href="/images/favicon/site.webmanifest" />
        <!-- Protocole Open Graph (utilisé par Facebook, LinkedIn, Discord, WhatsApp...) -->
        <meta property="og:title" content="">   <!-- Titre principal affiché sur l'aperçu -->
        <meta property="og:description" content=""> <!-- Court résumé ou accroche sous le titre -->
        <meta property="og:image" content="">   <!-- URL absolue de l'image miniature (ex: https://site.com/img.jpg) -->
        <meta property="og:url" content=""> <!-- URL canonique officielle de la page partagée -->
        <meta property="og:type" content="website"> <!-- Type d'entité (ex: website, article, video, profile) -->
        <!-- Métas pour Twitter / X Cards -->
        <meta name="twitter:card" content="summary">    <!-- Format d'affichage : petite carte (summary) ou grande bannière (summary_large_image) -->
        <meta name="twitter:title" content="">  <!-- Titre spécifique pour X (prend le relais sur og:title) -->
        <meta name="twitter:description" content="">    <!-- Description spécifique pour le flux X -->
        <meta name="twitter:image" content="">  <!-- Image d'aperçu spécifique à X -->
        <meta name="twitter:url" content="">    <!-- URL de la page pour le bot de X -->
